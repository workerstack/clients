name: e2e-snapshot

# The generated CLI's release path end to end (scripts/e2e-snapshot.ts): a fixture spec through
# honey-clients generate, a goreleaser snapshot signed keyless by this job's OIDC identity, installgen check and
# install.sh from this package's packed tarball against it, the installed binary's --version, and a tampered
# checksums.txt refused. The signature leg needs GitHub OIDC, so it runs here and is skipped by a local run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.4"

jobs:
  e2e:
    name: e2e-snapshot
    # a fork's pull request gets no OIDC token to sign with
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun scripts/e2e-snapshot.ts
        env:
          E2E_REQUIRE_SIGNATURE: "1"
