name: release-sync

# Reusable: mirrors each package a consumer's release config lists into its public repo, tagging a new version.
# Installs the toolchains its codegen needs from the consumer's system.config.ts and regenerates first, so the
# mirrored tree is what the committed spec generates. The push uses a GitHub App token (contents: write and
# workflows: write on the public repos); without the App's secrets only a dry run works. The caller owns triggers,
# concurrency (one sync at a time per product) and the permissions it grants (this job needs contents: read).
on:
  workflow_call:
    inputs:
      config:
        description: The release config, relative to the repo root (release.config.ts)
        type: string
        required: true
      app-owner:
        description: The owner of the App installation that can push the public repos; blank means the caller's owner
        type: string
        required: false
        default: ""
      dry-run:
        description: Stage each tree and report what would be pushed, pushing nothing
        type: boolean
        required: false
        default: false
      only:
        description: Comma-separated package names (name or project/name); blank means every package
        type: string
        required: false
        default: ""
    secrets:
      app-id:
        description: The GitHub App's ID
        required: false
      app-private-key:
        description: The GitHub App's private key
        required: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CONFIG: ${{ inputs.config }}
      APP_ID: ${{ secrets.app-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # the release config loads as TypeScript, which Node strips from 22.18 on
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # each name in the config's toolchains, installed at its system.config.ts pin; then the PATH a new shell gets
      # (system install's managed ~/.bashrc blocks) goes first for every later step. GITHUB_PATH prepends each line,
      # so the entries are written last to first. The installs run from the runner's temp dir, so a repo-local
      # toolchain file (rust-toolchain.toml, go.mod's toolchain line) cannot answer their installed-version check.
      - name: Install the release config's toolchains
        run: |
          set -euo pipefail
          names=$(bun x --no-install honey-clients release toolchains --config "$CONFIG")
          if [ -z "$names" ]; then
            echo "the release config lists no toolchains"
            exit 0
          fi
          mapfile -t toolchains <<< "$names"
          system="$PWD/node_modules/.bin/system"
          config="$PWD/system.config.ts"
          cd "$RUNNER_TEMP"
          for name in "${toolchains[@]}"; do
            "$system" install "$name" --upgrade --config "$config"
          done
          bash -ic 'printf "\n__RELEASE_PATH__%s\n" "$PATH"' 2>/dev/null \
            | sed -n 's/^__RELEASE_PATH__//p' | tr ':' '\n' | tac >> "$GITHUB_PATH"
      - name: Run the release config's codegen
        run: bun x --no-install honey-clients release codegen --config "$CONFIG"
      - id: app-token
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ inputs.app-owner }}
      - name: Sync the public repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=(--config "$CONFIG")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bun x --no-install honey-clients release sync "${args[@]}"
